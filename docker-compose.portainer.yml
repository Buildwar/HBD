# ============================================================
# HBD — HOME BOARD DESIGNER
# PORTAINER STACK DEPLOYMENT SPECIFICATION
# ============================================================

services:
  hbd-db:
    image: postgres:16-alpine
    container_name: hbd-portainer-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - hbd_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  hbd-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: hbd-portainer-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@hbd-db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      APP_NAME: ${APP_NAME:-HBD — Home Board Designer}
      APP_TAGLINE: ${APP_TAGLINE:-Diseña, mide y visualiza tu vivienda.}
      APP_AUTHOR: ${APP_AUTHOR:-apalma}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_COPYRIGHT: ${APP_COPYRIGHT:-© 2026 HBD — Home Board Designer}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
    volumes:
      - hbd_storage:/app/uploads
    depends_on:
      hbd-db:
        condition: service_healthy

  hbd-web:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: hbd-portainer-web
    restart: always
    ports:
      - "${HBD_EXTERNAL_PORT:-3003}:80"
    depends_on:
      - hbd-api

volumes:
  hbd_data:
  hbd_storage:
