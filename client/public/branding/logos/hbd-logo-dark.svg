<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <defs>
    <linearGradient id="emGradHorizDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="whiteGradHorizDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="1200" height="400" rx="36" fill="#0D151C"/>
  <rect x="2" y="2" width="1196" height="396" rx="34" stroke="#1E293B" stroke-width="3"/>

  <!-- Left Mark (scaled & positioned at x: 70, y: 70, w: 260, h: 260) -->
  <g transform="translate(60, 60) scale(0.546875)">
    <!-- Left Outer Roof & Wall -->
    <path d="M 256 60 L 60 215 L 60 410 L 96 384 L 96 240 L 256 112 Z" fill="url(#whiteGradHorizDark)"/>
    <!-- Right Outer Roof & Wall -->
    <path d="M 256 60 L 452 215 L 452 410 L 416 384 L 416 240 L 256 112 Z" fill="url(#emGradHorizDark)"/>
    <!-- Inner Architecture -->
    <path d="M 142 400 L 142 264 L 246 182 L 246 328 L 308 328" 
          stroke="url(#whiteGradHorizDark)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 256 390 L 256 350 L 312 350 L 312 400" 
          stroke="url(#emGradHorizDark)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 364 252 L 364 400" 
          stroke="url(#emGradHorizDark)" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="390" y1="90" x2="390" y2="310" stroke="#2A374A" stroke-width="3" stroke-linecap="round"/>

  <!-- Right Typography: HBD + HOME BOARD DESIGNER -->
  <g transform="translate(450, 0)">
    <!-- HBD Acronym -->
    <text x="0" y="255" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" font-size="168" letter-spacing="-2px">
      <tspan fill="#FFFFFF">H</tspan><tspan fill="#FFFFFF">B</tspan><tspan fill="url(#emGradHorizDark)">D</tspan>
    </text>

    <!-- Subtitle: HOME BOARD DESIGNER -->
    <text x="8" y="315" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="600" font-size="34" letter-spacing="11px" fill="#E2E8F0">
      HOME BOARD DESIGNER
    </text>
  </g>
</svg>
