<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="emGradMark_light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="whiteGradMark_light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="stepGradMark_light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, 10)">
    <!-- Left Gable Roof & Wall (White) -->
    <path d="M 256 56 L 68 196 L 68 416 L 106 394 L 106 220 L 256 106 Z" 
          fill="url(#whiteGradMark_light)"/>

    <!-- Right Gable Roof & Wall (Emerald Green) -->
    <path d="M 256 56 L 444 196 L 444 416 L 406 394 L 406 220 L 256 106 Z" 
          fill="url(#emGradMark_light)"/>

    <!-- Left Interior Architecture (White) -->
    <path d="M 152 414 L 152 272 L 248 198 L 248 320" 
          stroke="url(#whiteGradMark_light)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Transition Counter Step (White to Emerald) -->
    <path d="M 248 320 L 316 320" 
          stroke="url(#stepGradMark_light)" stroke-width="18" stroke-linecap="round"/>

    <!-- Emerald Architecture Right Drop & Floor Bar -->
    <path d="M 316 320 L 316 414" 
          stroke="url(#emGradMark_light)" stroke-width="18" stroke-linecap="round"/>

    <!-- Bottom Floor Bar & Partitions (Emerald) -->
    <path d="M 266 414 L 396 414" 
          stroke="url(#emGradMark_light)" stroke-width="18" stroke-linecap="round"/>
    <path d="M 266 414 L 266 362" 
          stroke="url(#emGradMark_light)" stroke-width="18" stroke-linecap="round"/>
    <path d="M 396 414 L 396 280" 
          stroke="url(#emGradMark_light)" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>