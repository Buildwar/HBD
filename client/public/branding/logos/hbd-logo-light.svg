<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <defs>
    <linearGradient id="emGradLogo_light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="whiteGradLogo_light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="stepGradLogo_light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="1200" height="400" rx="36" fill="#F8FAFC" fill-opacity="0.96"/>
  <rect x="2" y="2" width="1196" height="396" rx="34" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Left Mark (scaled) -->
  <g transform="translate(64, 48) scale(0.60)">
    <!-- Left Gable Roof & Wall (White) -->
    <path d="M 256 56 L 68 196 L 68 416 L 106 394 L 106 220 L 256 106 Z" 
          fill="url(#whiteGradLogo_light)"/>

    <!-- Right Gable Roof & Wall (Emerald Green) -->
    <path d="M 256 56 L 444 196 L 444 416 L 406 394 L 406 220 L 256 106 Z" 
          fill="url(#emGradLogo_light)"/>

    <!-- Left Interior Architecture (White) -->
    <path d="M 152 414 L 152 272 L 248 198 L 248 320" 
          stroke="url(#whiteGradLogo_light)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Transition Counter Step (White to Emerald) -->
    <path d="M 248 320 L 316 320" 
          stroke="url(#stepGradLogo_light)" stroke-width="18" stroke-linecap="round"/>

    <!-- Emerald Architecture Right Drop & Floor Bar -->
    <path d="M 316 320 L 316 414" 
          stroke="url(#emGradLogo_light)" stroke-width="18" stroke-linecap="round"/>

    <!-- Bottom Floor Bar & Partitions (Emerald) -->
    <path d="M 266 414 L 396 414" 
          stroke="url(#emGradLogo_light)" stroke-width="18" stroke-linecap="round"/>
    <path d="M 266 414 L 266 362" 
          stroke="url(#emGradLogo_light)" stroke-width="18" stroke-linecap="round"/>
    <path d="M 396 414 L 396 280" 
          stroke="url(#emGradLogo_light)" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Divider -->
  <line x1="410" y1="80" x2="410" y2="320" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>

  <!-- Right Typography: Vector Paths for H, B, D -->
  <g transform="translate(470, 95) scale(1.4)">
    <!-- Letter H -->
    <path d="M 0 0 L 26 0 L 26 34 L 62 34 L 62 0 L 88 0 L 88 100 L 62 100 L 62 62 L 26 62 L 26 100 L 0 100 Z" 
          fill="#0F172A"/>

    <!-- Letter B -->
    <path d="M 108 0 L 160 0 C 182 0 196 11 196 28 C 196 39 188 47 176 50 C 192 53 202 63 202 78 C 202 93 186 100 162 100 L 108 100 Z 
             M 134 24 L 134 40 L 156 40 C 166 40 170 36 170 32 C 170 28 166 24 156 24 Z 
             M 134 60 L 134 76 L 160 76 C 170 76 174 72 174 68 C 174 64 170 60 160 60 Z" 
          fill="#0F172A"/>

    <!-- Letter D -->
    <path d="M 224 0 L 270 0 C 308 0 334 22 334 50 C 334 78 308 100 270 100 L 224 100 Z 
             M 252 25 L 252 75 L 268 75 C 292 75 306 66 306 50 C 306 34 292 25 268 25 Z" 
          fill="url(#emGradLogo_light)"/>
  </g>

  <!-- Subtitle: HOME BOARD DESIGNER -->
  <text x="474" y="300" font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-weight="700" font-size="28" letter-spacing="11px" fill="#475569">
    HOME BOARD DESIGNER
  </text>
</svg>