<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <!-- Dark Squircle Background -->
  <rect width="512" height="512" rx="112" fill="#0D151C"/>
  <rect x="2" y="2" width="508" height="508" rx="110" stroke="#1E293B" stroke-width="4"/>

  <!-- Left Outer Roof & Wall (White/Silver) -->
  <path d="M 256 104 L 92 232 L 92 396 L 122 374 L 122 254 L 256 148 Z" fill="url(#whiteGrad)"/>

  <!-- Right Outer Roof & Wall (Emerald Green) -->
  <path d="M 256 104 L 420 232 L 420 396 L 390 374 L 390 254 L 256 148 Z" fill="url(#emeraldGrad)"/>

  <!-- Inner Architectural Geometry (Left white trace) -->
  <path d="M 160 390 L 160 274 L 246 206 L 246 328 L 298 328" 
        stroke="url(#whiteGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner Architectural Geometry (Right emerald trace) -->
  <path d="M 256 380 L 256 346 L 302 346 L 302 390" 
        stroke="url(#emeraldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 346 264 L 346 390" 
        stroke="url(#emeraldGrad)" stroke-width="14" stroke-linecap="round"/>
</svg>
