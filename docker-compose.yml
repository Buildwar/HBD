services:
  postgres:
    image: postgres:16-alpine
    container_name: hbd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hbd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hbd_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-hbd_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hbd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hbd_user} -d ${POSTGRES_DB:-hbd_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: hbd-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-hbd_user}:${POSTGRES_PASSWORD:-hbd_secure_password}@postgres:5432/${POSTGRES_DB:-hbd_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-hbd_super_secure_jwt_secret_key_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      APP_NAME: ${APP_NAME:-HBD — Home Board Designer}
      APP_TAGLINE: ${APP_TAGLINE:-Diseña, mide y visualiza tu vivienda.}
      APP_AUTHOR: ${APP_AUTHOR:-apalma}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_COPYRIGHT: ${APP_COPYRIGHT:-© 2026 HBD — Home Board Designer}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@hbd.local}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin1234!}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador del Sistema}
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      - hbd_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: hbd-frontend
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3003}:80"
    depends_on:
      - backend

volumes:
  hbd_postgres_data:
  hbd_uploads:
