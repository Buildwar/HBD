name: HBD CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root and workspace dependencies
        run: npm ci

      - name: Lint and Typecheck Shared
        run: npm --workspace=shared run build

      - name: Lint and Typecheck Server
        run: |
          cd server
          npx prisma generate
          npm run lint

      - name: Lint and Typecheck Client
        run: npm --workspace=client run lint

      - name: Run Tests
        run: npm run test

      - name: Build Shared
        run: npm --workspace=shared run build

      - name: Build Server
        run: npm --workspace=server run build

      - name: Build Client SPA
        run: npm --workspace=client run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: hbd-backend:test

      - name: Verify Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: client/Dockerfile
          push: false
          tags: hbd-frontend:test
