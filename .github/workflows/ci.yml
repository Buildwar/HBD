name: HBD Continuous Integration (CI)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Lint, Typecheck, Test and Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and Typecheck Shared
        run: npm --workspace=shared run build

      - name: Generate Prisma Client & Lint Server
        run: |
          cd server
          npx prisma generate
          npm run lint

      - name: Lint and Typecheck Client
        run: npm --workspace=client run lint

      - name: Run Test Suites
        run: npm run test

      - name: Build Shared, Server and Client
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Dry-run Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: hbd-server:ci-test

      - name: Dry-run Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: client/Dockerfile
          push: false
          tags: hbd-client:ci-test
