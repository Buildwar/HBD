name: HBD Release & GHCR Publication

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Docker image tag (e.g., 9.0.0)'
        required: true
        default: '9.0.0'

permissions:
  contents: read
  packages: write

jobs:
  validate-and-publish:
    name: Build, Verify and Publish to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and Typecheck Shared
        run: npm --workspace=shared run build

      - name: Generate Prisma Client & Lint Server
        run: |
          cd server
          npx prisma generate
          npm run lint

      - name: Lint and Typecheck Client
        run: npm --workspace=client run lint

      - name: Run Test Suites
        run: npm run test

      - name: Build Application Packages
        run: npm run build

      - name: Extract Tag / Version
        id: meta_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version_tag }}" >> "$GITHUB_OUTPUT"
            echo "IS_LATEST=true" >> "$GITHUB_OUTPUT"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            RAW_VERSION="${TAG_NAME#v}"
            echo "VERSION=${RAW_VERSION}" >> "$GITHUB_OUTPUT"
            echo "IS_LATEST=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata for Server
        id: meta_server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hbd-server
          tags: |
            type=raw,value=${{ steps.meta_version.outputs.VERSION }}
            type=raw,value=latest,enable=${{ steps.meta_version.outputs.IS_LATEST }}
            type=sha,prefix=sha-

      - name: Build and Push Server Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta_server.outputs.tags }}
          labels: ${{ steps.meta_server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker metadata for Client
        id: meta_client
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hbd-client
          tags: |
            type=raw,value=${{ steps.meta_version.outputs.VERSION }}
            type=raw,value=latest,enable=${{ steps.meta_version.outputs.IS_LATEST }}
            type=sha,prefix=sha-

      - name: Build and Push Client Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: client/Dockerfile
          push: true
          tags: ${{ steps.meta_client.outputs.tags }}
          labels: ${{ steps.meta_client.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
